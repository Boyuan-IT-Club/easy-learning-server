spring:
  application:
    name: early-learning-server
  profiles:
    active: dev

  data:
    redis:
      # 存放短时数据：Token、刷新宽限、敏感结果重放、限流计数。
      # 服务端必须关闭持久化（RDB 与 AOF），否则 Token 与激活码明文会落到磁盘。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  servlet:
    multipart:
      # 比业务上限（storage.upload.max-size-bytes，默认 500MB）略高：
      # 这样"略微超限"的文件能进到控制器，由业务抛出带 details.limit 的 413；
      # 只有远超上限的请求才会被 Spring 拦在更前面（那种情况没有 details 是合理的）。
      max-file-size: 520MB
      max-request-size: 540MB
      # Spring 默认阈值为 0，意思是**所有** multipart 文件部分先落盘到 servlet 临时目录。
      # 儿童录音在磁盘上留副本违反「不落盘、不写日志、不进备份」的硬约束，所以这里把阈值提到
      # 单段录音上限（ai.transcription.max-size-bytes，默认 50MB）之上：录音只在内存里。
      # 官方素材（上限 500MB）仍会溢写到临时目录——那是机构自有资源，不属该约束；Tomcat 在请求结束时清理。
      file-size-threshold: 60MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

  global-config:
    banner: false

aliyun:
  oss:
    # 使用客户端可访问的 HTTPS Endpoint；临时下载地址也使用此域名。
    endpoint: ${OSS_ENDPOINT:}
    region: ${OSS_REGION:}
    bucket-name: ${OSS_BUCKET_NAME:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    download-url-ttl-seconds: ${OSS_DOWNLOAD_URL_TTL_SECONDS:900}

    # 超时与连接池：不用 SDK 默认值（连接 50s、取连接无限等待、池 1024），
    # 那些默认值在故障时会把请求挂住而不是快速失败。详见 OssProperties 的说明。
    connection-timeout-ms: ${OSS_CONNECTION_TIMEOUT_MS:5000}
    socket-timeout-ms: ${OSS_SOCKET_TIMEOUT_MS:30000}
    connection-request-timeout-ms: ${OSS_CONNECTION_REQUEST_TIMEOUT_MS:5000}
    max-connections: ${OSS_MAX_CONNECTIONS:64}
    max-error-retry: ${OSS_MAX_ERROR_RETRY:2}

material:
  publish:
    # ZIP 发布的部署上限:压缩包、解压总量与包内条目数。业务上限要低于 multipart 上限,
    # 超限才能带着 details.limit 返回 413 而不是被 servlet 提前拦截。
    max-zip-bytes: ${MATERIAL_MAX_ZIP_BYTES:524288000}
    max-uncompressed-bytes: ${MATERIAL_MAX_UNCOMPRESSED_BYTES:1073741824}
    max-file-count: ${MATERIAL_MAX_FILE_COUNT:200}

storage:
  upload:
    # 业务侧单文件上限。413 PAYLOAD_TOO_LARGE 的 details.limit.maximum 用的就是这个值，
    # 所以它必须比 spring.servlet.multipart 的上限低——否则超限会先被 Spring 拦下，带不出 details。
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:524288000}

# 激活码用 HMAC-SHA256(pepper) 落库。pepper 至少 32 字符，只从环境变量读取；
# 更换后已签发的激活码全部无法匹配，所以上线后不要改。
secret:
  code-pepper: ${AUTH_CODE_PEPPER:}

auth:
  # 教师 access_token、管理员 Token 的有效期。refresh_token 不设到期时间（契约）。
  access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:30m}
  admin-token-ttl: ${AUTH_ADMIN_TOKEN_TTL:8h}

idempotency:
  # 含明文凭证的写接口（生成激活码、注册、刷新）结果的重放时长，过期后返回 SENSITIVE_RESULT_EXPIRED。
  sensitive-replay-ttl: ${IDEMPOTENCY_SENSITIVE_REPLAY_TTL:10m}

admin:
  # 首个管理员：表里没有任何管理员时才创建；之后忽略。密码只放在环境变量里。
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

app:
  cors:
    # 跨域放行的来源;开发默认全放行(凭据不跨域,令牌走 Authorization 头)。
    # 生产示例:https://admin.example.edu,http://localhost:*
    allowed-origin-patterns: "*"
